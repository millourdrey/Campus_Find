<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CampusFind{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: #f6f5fb;
            color: #24213a;
        }

        header {
            background: white;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px #0000000c;
        }

        .logo {
            color: #6542c0;
            font-size: 25px;
            font-weight: 800;
            text-decoration: none;
        }

        nav { display: flex; align-items: center; gap: 22px; }

        nav a {
            text-decoration: none;
            color: #514b63;
            font-size: 14px;
            font-weight: 600;
        }

        .container { width: 86%; max-width: 1150px; margin: 40px auto; }

        .btn {
            display: inline-block;
            background: #6542c0;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 9px;
            text-decoration: none;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover { background: #5030a2; }

        .btn-light {
            background: #eee9fa;
            color: #6542c0;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px #29204d0a;
            margin-bottom: 22px;
        }

        h1 { font-size: 30px; margin-bottom: 8px; }
        h2 { font-size: 21px; margin-bottom: 16px; }

        p { color: #777286; line-height: 1.7; }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dedbe8;
            border-radius: 8px;
            margin-top: 6px;
            margin-bottom: 15px;
            font-family: inherit;
        }

        label { font-weight: 600; font-size: 14px; }

        .auth-box {
            max-width: 480px;
            margin: 55px auto;
        }

        .messages {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 9px;
            background: #e9f8ee;
            color: #23743c;
        }

        .errorlist { color: #c0392b; margin: 5px 0 12px 20px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item-photo {
            width: 100%;
            height: 170px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .status {
            display: inline-block;
            background: #eee9fa;
            color: #6542c0;
            padding: 5px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin: 8px 0;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #898498;
            font-size: 13px;
        }

        @media(max-width: 650px) {
            header { padding: 15px 5%; flex-wrap: wrap; gap: 12px; }
            nav { gap: 12px; flex-wrap: wrap; }
            nav a { font-size: 12px; }
            .container { width: 92%; }
            h1 { font-size: 25px; }
        }
    </style>
</head>

<body>
<header>
    <a href="/" class="logo">CampusFind.</a>

    <nav>
        {% if user.is_authenticated %}
            <a href="/">Dashboard</a>
            <a href="{% url 'report_item' %}">Report Item</a>
            <form method="POST" action="{% url 'logout' %}" style="margin:0;">
                {% csrf_token %}
                <button type="submit" class="btn btn-light">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
            <a href="{% url 'register' %}" class="btn">Register</a>
        {% endif %}
    </nav>
</header>

<main class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="messages">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</main>

<footer>
    CampusFind — Every Lost Item Deserves to Be Found.
</footer>
</body>
</html>
